<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — UB Portfolio CMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Syne:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#050508;--neon-blue:#00D4FF;--neon-purple:#A855F7;
      --surface:rgba(12,12,22,.9);--border:rgba(0,212,255,.15);
      --text:#f3f4f6;--muted:rgba(255,255,255,.55);--danger:#ff2a5f;
    }
    body{font-family:'Space Grotesk',sans-serif;background:var(--bg);color:var(--text);
      min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;}
    body::before{content:'';position:absolute;inset:0;
      background-image:linear-gradient(rgba(0,212,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,.03) 1px,transparent 1px);
      background-size:50px 50px;}
    .glow{position:absolute;border-radius:50%;filter:blur(120px);pointer-events:none}
    .g1{width:500px;height:500px;background:rgba(0,212,255,.1);top:-15%;left:-15%}
    .g2{width:400px;height:400px;background:rgba(168,85,247,.1);bottom:-10%;right:-10%}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:24px;
      padding:48px 40px;width:100%;max-width:420px;position:relative;z-index:10;
      backdrop-filter:blur(20px);box-shadow:0 0 80px rgba(0,212,255,.06)}
    .logo{text-align:center;margin-bottom:36px}
    .logo-text{font-family:'Syne',sans-serif;font-size:2.5rem;font-weight:900;
      background:linear-gradient(135deg,var(--neon-blue),var(--neon-purple));
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-1px}
    .logo-sub{font-size:.7rem;letter-spacing:4px;text-transform:uppercase;color:var(--muted);margin-top:6px}
    .field{margin-bottom:20px}
    .field label{display:block;font-size:.7rem;letter-spacing:2px;text-transform:uppercase;
      color:var(--muted);margin-bottom:8px;font-weight:600}
    .field input{width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);
      border-radius:12px;padding:14px 16px;color:var(--text);font-family:'Space Grotesk',sans-serif;
      font-size:.9rem;outline:none;transition:border-color .2s}
    .field input:focus{border-color:var(--neon-blue);box-shadow:0 0 0 3px rgba(0,212,255,.1)}
    .btn{width:100%;padding:14px;border:none;border-radius:50px;
      background:linear-gradient(135deg,var(--neon-blue),var(--neon-purple));
      color:#050508;font-family:'Space Grotesk',sans-serif;font-size:.9rem;font-weight:700;
      cursor:pointer;letter-spacing:1px;margin-top:8px;transition:opacity .2s,transform .2s}
    .btn:hover{opacity:.88;transform:translateY(-1px)}
    .err{color:var(--danger);font-size:.8rem;margin-top:14px;text-align:center;display:none}
  </style>
</head>
<body>
  <div class="glow g1"></div>
  <div class="glow g2"></div>
  <div class="card">
    <div class="logo">
      <div class="logo-text">UB.</div>
      <div class="logo-sub">CMS Admin Portal</div>
    </div>
    <form id="loginForm">
      <div class="field">
        <label>Username</label>
        <input type="text" id="uname" placeholder="admin" autocomplete="username" required>
      </div>
      <div class="field">
        <label>Password / Token</label>
        <input type="password" id="pwd" placeholder="Enter admin token" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn">Access Dashboard →</button>
      <div class="err" id="err">❌ Invalid credentials. Please try again.</div>
    </form>
  </div>
  <script>
    if (localStorage.getItem('adminToken')) location.href = 'dashboard.html';
    document.getElementById('loginForm').addEventListener('submit', e => {
      e.preventDefault();
      const u = document.getElementById('uname').value.trim();
      const p = document.getElementById('pwd').value.trim();
      if (u === 'admin' && p === 'portfolio_admin_2026') {
        localStorage.setItem('adminToken', 'portfolio_admin_2026');
        location.href = 'dashboard.html';
      } else {
        document.getElementById('err').style.display = 'block';
      }
    });
  </script>
</body>
</html>
